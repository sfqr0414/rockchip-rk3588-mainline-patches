# DKMS configuration for Rockchip VEPU580 encoder driver

PACKAGE_NAME="rk-vcodec"
PACKAGE_VERSION="1.0"

# Module information
BUILT_MODULE_NAME[0]="rkvenc"
DEST_MODULE_LOCATION[0]="/updates/dkms/"

# Auto-install
AUTOINSTALL="yes"

# Build configuration
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Module information
MODULE_NAME="rkvenc"
MODULE_VERSION="${PACKAGE_VERSION}"
MODULE_LICENSE="GPL-2.0+ OR MIT"
MODULE_AUTHOR="Ross Cawston"
MODULE_DESCRIPTION="Rockchip RK3588 VEPU580 H.265 encoder driver"
